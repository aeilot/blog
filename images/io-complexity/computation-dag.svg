<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">Computation DAG</title><desc id="desc">a and b produce u=a+b; c and d produce v=c+d; u and v produce y=uv.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#52647a"/></marker></defs><rect width="760" height="340" rx="18" fill="#f5f7fb"/><g fill="none" stroke="#52647a" stroke-width="2.5" marker-end="url(#arrow)"><path d="M100 78 L170 150"/><path d="M270 78 L210 150"/><path d="M490 78 L550 150"/><path d="M660 78 L590 150"/><path d="M190 202 L342 270"/><path d="M570 202 L418 270"/></g><g fill="white" stroke="#52647a" stroke-width="2"><rect x="65" y="25" width="70" height="52" rx="10"/><rect x="235" y="25" width="70" height="52" rx="10"/><rect x="455" y="25" width="70" height="52" rx="10"/><rect x="625" y="25" width="70" height="52" rx="10"/><rect x="110" y="150" width="160" height="52" rx="10"/><rect x="490" y="150" width="160" height="52" rx="10"/><rect x="300" y="267" width="160" height="52" rx="10"/></g><g fill="#18283d" font-family="Arial,sans-serif" font-size="23" text-anchor="middle"><text x="100" y="59">a</text><text x="270" y="59">b</text><text x="490" y="59">c</text><text x="660" y="59">d</text><text x="190" y="184">u = a + b</text><text x="570" y="184">v = c + d</text><text x="380" y="301">y = uv</text></g></svg>